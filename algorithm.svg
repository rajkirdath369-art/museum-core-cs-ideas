<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420"><rect width="700" height="420" rx="20" fill="#f4f6fa"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="220" y="24" width="260" height="54" rx="27" fill="#17233d"/><text x="350" y="57" font-size="18" fill="#fff">Start with first number</text><path d="M350 78v28" stroke="#b89143" stroke-width="3"/><path d="M342 98l8 10 8-10" fill="none" stroke="#b89143" stroke-width="3"/><rect x="220" y="110" width="260" height="54" rx="8" fill="#dce8e8" stroke="#7997a1"/><text x="350" y="143" font-size="18" fill="#17233d">Compare next number</text><path d="M350 164v27" stroke="#b89143" stroke-width="3"/><path d="M342 183l8 10 8-10" fill="none" stroke="#b89143" stroke-width="3"/><path d="M350 194l115 55-115 55-115-55z" fill="#fff" stroke="#b89143" stroke-width="2"/><text x="350" y="245" font-size="16" fill="#17233d">Is it larger?</text><text x="350" y="265" font-size="12" fill="#657186">Update if yes</text><path d="M465 249h95v47" stroke="#7997a1" stroke-width="2" fill="none"/><path d="M552 289l8 8 8-8" stroke="#7997a1" stroke-width="2" fill="none"/><text x="580" y="272" font-size="13" fill="#657186">More items?</text><path d="M235 249H130v47" stroke="#7997a1" stroke-width="2" fill="none"/><path d="M122 289l8 8 8-8" stroke="#7997a1" stroke-width="2" fill="none"/><rect x="42" y="300" width="176" height="60" rx="8" fill="#dce8e8"/><text x="130" y="324" font-size="15" fill="#17233d">Yes: compare</text><text x="130" y="344" font-size="15" fill="#17233d">next item</text><rect x="482" y="300" width="176" height="60" rx="8" fill="#e8c783"/><text x="570" y="324" font-size="15" fill="#17233d">No: return</text><text x="570" y="344" font-size="15" fill="#17233d">largest value</text><text x="350" y="395" font-size="14" fill="#657186">Example: 4, 9, 2, 7 → largest is 9</text></g></svg>